[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "c1-inceptiontime"
version = "0.1.0"
description = "C1-E43: isolated adapted InceptionTime temporal comparator"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.3.5", "scipy==1.18.1", "scikit-learn==1.9.1", "torch==2.8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
